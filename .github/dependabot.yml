# Dependabot : chaque lundi, propose par pull request les nouvelles versions de ce que le
# projet épingle (décision 0007). Chaque proposition passe par la CI comme les autres.
#
# - Les mises à jour mineures et correctives d'un même écosystème arrivent groupées en
#   une seule pull request ; une version majeure arrive seule, pour être lue de près.
# - Une version doit avoir 7 jours avant d'être proposée : une version piégée est
#   souvent repérée et retirée dans les premiers jours.
# - 5 pull requests ouvertes au plus, tous écosystèmes confondus (2 + 1 + 1 + 1).

version: 2

updates:
  # Dépendances Python : uv.lock (et les bornes de pyproject.toml si besoin).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python-mineures:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  # Images de départ du Dockerfile (Python, uv).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      images-mineures:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  # Image de la base dans compose.yaml (PostgreSQL).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    commit-message:
      prefix: build(deps)

  # Actions des workflows GitHub (SHA de commit et version en commentaire).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci(deps)

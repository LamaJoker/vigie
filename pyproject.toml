[build-system]
# uv_build est intégré à uv : construire le paquet ne télécharge aucun outil de plus.
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[project]
name = "vigie"
version = "0.5.0"
description = "Service de surveillance de sites web (projet de formation DevOps)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    # pool de connexions de l'API ; check_connection existe depuis la 3.2
    "psycopg-pool>=3.2,<4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1,<4",
    # base des fuseaux horaires : la page affiche l'heure locale même dans une image
    # qui n'en a pas
    "tzdata>=2024.1",
]

# Les versions exactes, avec l'empreinte de chaque paquet, sont dans uv.lock (« make
# verrouiller » le recalcule). Ici, seulement les bornes acceptées.

# Outils de développement : installés par « uv sync », jamais dans l'image (--no-dev).
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.scripts]
vigie = "vigie.cli:main"

[tool.uv]
# Même version de uv partout : poste, CI (setup-uv la lit ici) et image (Dockerfile).
required-version = "==0.13.8"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--cov=vigie --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W : style PEP 8, F : erreurs, I : ordre des imports, B : pièges courants,
# UP : syntaxe moderne, SIM : simplifications
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

# Configuration de la sonde Vigie.

[sonde]
delai = 10        # secondes accordées à chaque site, redirections comprises
paralleles = 10   # nombre de sites testés en même temps
intervalle = 300  # secondes entre deux passages (la variable VIGIE_INTERVALLE prime)
# Au-delà de 3 intervalles sans mesure, la page de statut signale des mesures périmées.

[affichage]
fuseau = "Europe/Paris"  # fuseau horaire des heures affichées sur la page de statut

[alertes]
# Nombre d'échecs consécutifs avant d'ouvrir un incident et d'envoyer une alerte.
# Avec un passage toutes les 5 minutes, 2 échecs = environ 10 minutes de panne.
# L'adresse du webhook Discord est un secret : elle se règle dans la variable
# d'environnement VIGIE_DISCORD_WEBHOOK (voir .env.exemple), jamais ici.
echecs_avant_alerte = 2

[retention]
# Les mesures plus vieilles sont supprimées une fois par jour par la sonde (ou à la
# demande : vigie purger). Les incidents, eux, sont toujours gardés.
jours = 90

[[sites]]
nom = "Wikipédia"
url = "https://www.wikipedia.org"

[[sites]]
nom = "GitHub"
url = "https://github.com"

[[sites]]
nom = "Debian"
url = "https://www.debian.org"

[[sites]]
nom = "data.gouv.fr"
url = "https://www.data.gouv.fr"

[[sites]]
nom = "Example"
url = "https://example.com"
